<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work</title>
    <link href="./src/styles-output.css" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder" style="min-height: 60px;"></div>
<main class="main">
    <h1>Hello World</h1>
    <p>Testing second page</p>
</main>

<script>
    document.addEventListener("navbarLoaded", () => {
        // Initialize hamburger menu functionality after content loads
        const hamburger = document.getElementById(".hamburger");
        const navLinks = document.getElementById(".navLinks");

        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('open');
                hamburger.classList.toggle('active');
            });

            document.querySelectorAll('.mobile-nav > .nav-links a').forEach(link => {
                link.addEventListener('click', function (e) {
                    navLinks.classList.remove('open');
                    hamburger.classList.remove('active');
                });
            });
        }
    })
</script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch("nav.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("navbar-placeholder").innerHTML = data;
                document.dispatchEvent(new Event("navbarLoaded"));

                // Loop through all anchor tags on the page
                document.querySelectorAll('.nav-links > a').forEach(link => {
                    // Check if the href contains the specific file name
                    if (link.getAttribute('href').includes('work.html')) {
                        // Add your active class
                        link.classList.add('active');
                    }
                });
            })
            .catch(error => console.error("Error loading navigation:", error));
    });
</script>
</body>
</html>
