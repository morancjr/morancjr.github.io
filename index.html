<aside class="mobile-nav" style="display: none;" aria-label="Mobile nav menu">

    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');

        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('open');
            hamburger.classList.toggle('active');
        });

        document.querySelectorAll('.mobile-nav > .nav-links a').forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelectorAll('.mobile-nav > .nav-links a').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
                navLinks.classList.remove('open');
                hamburger.classList.remove('active');
            });
        });
    </script>
